# Web / API service (public HTTP).
# Create separate Railway services for worker + beat using:
#   railway.worker.toml  and  railway.beat.toml
# See docs/railway-deploy.md — operators only press Start/Stop in Phone Desk.

[deploy]
startCommand = "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60"
releaseCommand = "python manage.py migrate --noinput && python manage.py seed_sources"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
